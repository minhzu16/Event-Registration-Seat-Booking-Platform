name: CI & Concurrency Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Check
        run: |
          pnpm --filter event-platform-api build
          pnpm --filter web build

  test-concurrency:
    name: Concurrency Integration Tests (Real PostgreSQL)
    runs-on: ubuntu-latest
    env:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/event_platform
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghij
      QR_HMAC_SECRET: ci-only-qr-hmac-secret-0123456789abcdefghij
      BOOKING_STRATEGY: pessimistic
      # Demo mode seeds admin@eventplatform.com / password123, the defaults the live tests log in with.
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Database Schema
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=testpassword psql -h localhost -U postgres -d event_platform -f scripts/schema.sql

      - name: Start API in Background
        run: |
          pnpm --filter event-platform-api dev &
          timeout 60 bash -c 'until curl -sf http://localhost:4000/health; do sleep 1; done'

      - name: Run Concurrency & Integrity Test Suite
        env:
          LIVE_API: "1"
        run: |
          pnpm --filter event-platform-api test
