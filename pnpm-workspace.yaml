packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAge: 0

# Security floors for transitive deps flagged by `pnpm audit`.
overrides:
  source-map-js: '>=1.2.2'
  body-parser@<1.20.9: '>=1.20.9 <2'

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - '@swc/core'
  - bcryptjs
